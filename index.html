    <!-- Basic Styling -->
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 500px; margin: auto; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; }
        button { background-color: #007bff; color: white; padding: 10px; width: 100%; border: none; }
        .status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Checkout</h2>
        <form id="checkoutForm">
            <label>Full Name</label>
            <input type="text" id="fullName" required>

            <label>Email</label>
            <input type="email" id="email" required>

            <label>Shipping Address</label>
            <input type="text" id="address" required>

            <label>Credit Card Number</label>
            <input type="text" id="ccNumber" required>

            <label>Expiration Date</label>
            <input type="text" id="ccExpiry" required>

            <label>CVV</label>
            <input type="text" id="ccCVV" required>

            <button type="submit">Place Order</button>
        </form>

        <div class="status" id="orderStatus"></div>
    </div>

    <script>
        const forterAPI = "https://api.forter.com/v2"; // Forter API base URL
        const merchantID = "your-merchant-id"; // Replace with real merchant ID
        const orderStatusDiv = document.getElementById("orderStatus");

        document.getElementById("checkoutForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const orderData = {
                fullName: document.getElementById("fullName").value,
                email: document.getElementById("email").value,
                shippingAddress: document.getElementById("address").value,
                paymentDetails: {
                    ccNumber: document.getElementById("ccNumber").value,
                    ccExpiry: document.getElementById("ccExpiry").value,
                    ccCVV: document.getElementById("ccCVV").value
                }
            };

            try {
                // Step 1: Create Order in Forter
                const orderResponse = await fetch(`${forterAPI}/orders`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json", 
                        "Authorization": "Bearer your-api-key" 
                    },
                    body: JSON.stringify({ merchantId: merchantID, orderData })
                });

                const orderResult = await orderResponse.json();
                if (orderResult.status === "approved") {
                    orderStatusDiv.innerHTML = "✅ Order Approved! Checking order status...";
                    
                    // Step 2: Check Order Status
                    setTimeout(() => checkOrderStatus(orderResult.orderId), 3000);
                } else {
                    orderStatusDiv.innerHTML = "❌ Order Declined!";
                }

                // Track event in Segment
                analytics.track("Order Submitted", orderData);
            } catch (error) {
                console.error("Order Processing Error:", error);
                orderStatusDiv.innerHTML = "⚠️ Error processing your order.";
            }
        });

        async function checkOrderStatus(orderId) {
            try {
                const statusResponse = await fetch(`${forterAPI}/order-status/${orderId}`, {
                    headers: { "Authorization": "Bearer your-api-key" }
                });
                const statusData = await statusResponse.json();
                orderStatusDiv.innerHTML += `<br>🕒 Order Status: ${statusData.status}`;

                if (statusData.status === "failed") {
                    submitClaim(orderId);
                }

                // Track order status in Segment
                analytics.track("Order Status Checked", { orderId, status: statusData.status });
            } catch (error) {
                console.error("Order Status Error:", error);
            }
        }

        async function submitClaim(orderId) {
            try {
                orderStatusDiv.innerHTML += `<br>🔄 Submitting claim...`;

                const claimResponse = await fetch(`${forterAPI}/claims`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer your-api-key" },
                    body: JSON.stringify({ orderId, reason: "Fraudulent Transaction" })
                });

                const claimData = await claimResponse.json();
                orderStatusDiv.innerHTML += `<br>📢 Claim Submitted: ${claimData.status}`;

                // Track claim submission in Segment
                analytics.track("Claim Submitted", { orderId, claimStatus: claimData.status });
            } catch (error) {
                console.error("Claim Submission Error:", error);
                orderStatusDiv.innerHTML += `<br>⚠️ Claim submission failed.`;
            }
        }
    </script>

</body>
</html>
